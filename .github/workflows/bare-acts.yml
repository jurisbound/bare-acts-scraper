# JurisBound - Bare Acts from India Code (https://indiacode.gov.in).
#
# Collects only: the Act record, its section records (when India Code has them) and its PDF, into
# the database (schema jb_kb) and Azure Blob Storage. Reading the PDF text, OCR for scanned pages,
# cutting sections and the search index are done afterwards by the court pipeline
# (`acts_cli.py text`, `acts_cli.py index`), not here.
#
# Weekly (Sunday night): every central Act (about 30-60 minutes when nothing changed).
# Monthly (the 2nd): every Act in the Centre's repealed list (about 4,630; 4-5 hours even when nothing
# changed, because each Act's file list is read with India Code's 2-second pause; repealed Acts almost
# never change). An Act whose PDF India Code has not replaced is logged "unchanged" without a download.
# An Act we hold that India Code moves to the repealed list is noticed by the weekly run (it leaves the
# list of Acts) and marked repealed in place by the monthly run (same row, same JurisBound number).
#
# State Acts: started by hand (Run workflow, what = states). JurisBound decided (28 Oct 2026) to load
# all states after the section cutting has been tested on a few states; one job per state, at most
# 3 at a time, each with India Code's two-second pause between requests.
#
# Gazette: started by hand (Run workflow, what = gazette) for a new Act that is in the Gazette of India
# but not yet on India Code: give the Gazette PDF link, the Act's number, year and title. Only the PDF
# is saved here; the pipeline's `text` step cuts its sections (Gazette layout). When India Code adds
# the same Act (same number and year), the weekly run updates that same Act; no second copy.

name: JurisBound - Bare Acts (India Code)

on:
  schedule:
    - cron: "30 16 * * 0"          # weekly, Sundays 22:00 IST: central Acts (GitHub often starts it later)
    - cron: "30 18 1 * *"          # monthly, the 2nd at 00:00 IST: repealed Acts
  workflow_dispatch:
    inputs:
      what:
        description: "central = all central Acts; repealed = all repealed central Acts; states = the states below; gazette = one new Act from its Gazette PDF (fill the gazette boxes)"
        required: true
        default: central
        type: choice
        options: [central, repealed, states, gazette]
      states:
        description: "states only: all, or names as in bare-acts/states.txt separated by commas (e.g. Telangana,Andhra Pradesh)"
        required: false
        default: ""
      limit:
        description: "Stop after this many Acts per job (empty = no limit; a limited run never marks Acts as missing)"
        required: false
        default: ""
      dry_run:
        description: "true = read and count only, save nothing"
        required: false
        default: "false"
      gazette_url:
        description: "gazette only: link to the Act's PDF on egazette.gov.in"
        required: false
        default: ""
      act_number:
        description: "gazette only: the Act's number (30 for Act 30 of 2025)"
        required: false
        default: ""
      act_year:
        description: "gazette only: the Act's year (2025)"
        required: false
        default: ""
      act_title:
        description: 'gazette only: the Act''s title, e.g. The Income-tax Act, 2025'
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  # Azure: Acts into schema jb_kb as the login jb_court, PDFs into Azure Blob Storage
  SYNC_DATABASE_URL: ${{ secrets.AZURE_KB_DATABASE_URL }}
  STORAGE_BACKEND: azure
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
  SUPABASE_S3_BUCKET: court-documents
  BARE_ACTS_SCHEMA: jb_kb

jobs:
  central:
    if: github.event.schedule == '30 16 * * 0' || github.event.inputs.what == 'central'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: bare-acts-central, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: bare-acts/requirements.txt }
      - run: pip install -r bare-acts/requirements.txt
      - name: Central Acts
        working-directory: bare-acts
        env:
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--all-central"
          [ -n "$IN_LIMIT" ] && ARGS="$ARGS --limit $IN_LIMIT"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          echo "Running: python load.py $ARGS"
          python load.py $ARGS

  repealed:
    needs: [central]
    # after the central job on the monthly run; on its own when started by hand
    if: always() && (github.event.schedule == '30 18 1 * *' || github.event.inputs.what == 'repealed')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: bare-acts/requirements.txt }
      - run: pip install -r bare-acts/requirements.txt
      - name: Repealed central Acts (all; saved ones are skipped)
        working-directory: bare-acts
        env:
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--all-repealed"
          [ -n "$IN_LIMIT" ] && ARGS="$ARGS --limit $IN_LIMIT"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          echo "Running: python load.py $ARGS"
          python load.py $ARGS

  plan:
    if: github.event.inputs.what == 'states'
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.list.outputs.states }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          IN_STATES: ${{ github.event.inputs.states }}
        run: |
          python3 - <<'PY'
          import json, os
          known = [l.split("\t")[0] for l in open("bare-acts/states.txt", encoding="utf-8") if l.strip() and not l.startswith("#")]
          want = os.environ["IN_STATES"].strip()
          if want.lower() == "all":
              chosen = known
          else:
              chosen = [s.strip() for s in want.split(",") if s.strip()]
              wrong = [s for s in chosen if s not in known]
              if not chosen or wrong:
                  raise SystemExit(f"Unknown or missing state names: {wrong or want!r}. Use the names in bare-acts/states.txt.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("states=" + json.dumps(chosen) + "\n")
          print("States:", ", ".join(chosen))
          PY

  state:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    concurrency: { group: "bare-acts-${{ matrix.state }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: bare-acts/requirements.txt }
      - run: pip install -r bare-acts/requirements.txt
      - name: State Acts
        working-directory: bare-acts
        env:
          IN_STATE: ${{ matrix.state }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          [ -n "$IN_LIMIT" ] && ARGS="$ARGS --limit $IN_LIMIT"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          echo "Running: python load.py --state \"$IN_STATE\" $ARGS"
          python load.py --state "$IN_STATE" $ARGS

  gazette:
    if: github.event.inputs.what == 'gazette'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: bare-acts/requirements.txt }
      - run: pip install -r bare-acts/requirements.txt
      - name: One new Act from the Gazette of India
        working-directory: bare-acts
        env:
          IN_URL: ${{ github.event.inputs.gazette_url }}
          IN_NUMBER: ${{ github.event.inputs.act_number }}
          IN_YEAR: ${{ github.event.inputs.act_year }}
          IN_TITLE: ${{ github.event.inputs.act_title }}
          IN_DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          case "$IN_URL" in https://egazette.gov.in/*.pdf) ;; *) echo "gazette_url must be a PDF link on https://egazette.gov.in/"; exit 1;; esac
          [[ "$IN_NUMBER" =~ ^[0-9]{1,4}$ ]] || { echo "act_number must be a number"; exit 1; }
          [[ "$IN_YEAR" =~ ^(19|20)[0-9]{2}$ ]] || { echo "act_year must be a year like 2025"; exit 1; }
          [ -n "$IN_TITLE" ] || { echo "act_title is needed"; exit 1; }
          ARGS=(--gazette "$IN_URL" --act-number "$IN_NUMBER" --act-year "$IN_YEAR" --gazette-title "$IN_TITLE")
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry-run)
          echo "Running: python load.py ${ARGS[*]}"
          python load.py "${ARGS[@]}"
